name: Generate Latest Mountain Obscuration Polygons

on:
  # Fires 35 minutes after each real G-AIRMET cycle hour (03/09/15/21Z)
  # -- deliberately staggered LATER than generate_ifr.yml's 20-minute
  # mark (not just cosmetically different): this hazard fetches TEN
  # real NBM fields per forecast hour vs. IFR's four (see
  # pipeline/hazards/mtn_obsc.py's docstring), so it takes noticeably
  # longer to run. The stagger originally existed because both
  # workflows pushed to main and risked colliding there; they now
  # publish to separate branches and cannot collide at all, but the
  # offset is kept anyway so the two runs don't fetch from NBM
  # simultaneously.
  schedule:
    - cron: "35 3,9,15,21 * * *"
  # Manual trigger, with optional overrides so a forecaster can
  # regenerate with different settings without editing code.
  workflow_dispatch:
    inputs:
      threshold_pct:
        description: "Probability threshold (%) for hazard polygons"
        required: false
        default: "50"
      clearance_margin_ft:
        description: "Terrain clearance margin (ft) added to real terrain rise before interpolating probability -- 0/500/1000/2000 are the standard options"
        required: false
        default: "500"
      neighborhood_radius_nm:
        description: "Neighborhood-max smoothing radius (nautical miles) -- pulls nearby smaller areas into larger ones"
        required: false
        default: "50"
      min_area_sq_mi:
        description: "Minimum polygon area (sq mi) -- matches AIRMET/G-AIRMET's historical 'widespread' criterion by default"
        required: false
        default: "3000"

# Ensures only ONE run of this workflow is ever actually executing at a
# time -- same reasoning as generate_ifr.yml's own concurrency block, in
# full there. Short version: the original push-rejection race it was
# added for is gone (runs force-push a from-scratch data branch now, not
# main), but force-pushing brought a quieter one -- of two overlapping
# runs, whichever finishes LAST wins even if it carries an OLDER model
# cycle, silently walking the live site's data backwards. Queueing makes
# last-to-finish and newest-cycle the same run. This matters MORE here
# than for IFR: this job can take tens of minutes (see timeout-minutes
# below), so it has a much wider window to be overtaken.
#
# The group is scoped to THIS workflow alone, distinct from
# generate_ifr.yml's ("generate-ifr-polygons"), because the race is
# entirely same-hazard: two runs of THIS workflow, force-pushing THIS
# branch. The two hazards publish to separate branches now and cannot
# collide with each other at all, so a shared group would only make this
# job's long runs needlessly block IFR's.
#
# cancel-in-progress is set explicitly to false: a new trigger QUEUES and
# waits its turn rather than silently cancelling a run already in
# progress.
#
# Note this only covers runs that OVERLAP. Re-running an old run from the
# Actions tab long after the fact is a different problem, handled by the
# cycle monotonicity guard in the publish step below.
concurrency:
  group: generate-mtn-obsc-polygons
  cancel-in-progress: false

# Needed to force-push the regenerated forecast-hour snapshots to the
# data-mtnobsc branch -- the default GITHUB_TOKEN is read-only unless
# granted this. Nothing here writes to main.
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    # Was completely unset originally -- a real production run took over
    # 30 minutes and had to be manually cancelled, with no automatic
    # timeout at all (GitHub's own default cap is 360 minutes/6 hours for
    # a job with no explicit limit).
    #
    # First attempt at a fix was concurrent fetching, set to 20 min based
    # on that approach's measured speedup -- but a real run then revealed
    # the ORIGINAL diagnosis was wrong about the mechanism: fetch+cfgrib
    # was always fast (under 6s/field); the real cost was
    # regrid_to_regular_latlon()'s default "linear" interpolation method
    # (140-198s/field, confirmed directly from that run's own timing
    # output). Fixed at the source with method="nearest" for this
    # hazard's regrid calls specifically (~20x faster, measured directly
    # -- see prepare_mtn_obsc_grid's docstring for the full story), which
    # in turn made the concurrency itself counterproductive (CPU
    # contention under threads once the real bottleneck was gone), so
    # this reverted to plain sequential fetching.
    #
    # 30 min gives real margin above a rough estimate (~10-15 min) for
    # this fix, since -- unlike the concurrency attempt -- it hasn't yet
    # been confirmed against a real production run. Tighten this once a
    # real run confirms actual numbers, same as MOUNTAINOUS_RELIEF_THRESHOLD_FT
    # and terrain_radius_nm are provisional pending real confirmation.
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Generate latest Mountain Obscuration polygons
        env:
          MTN_OBSC_THRESHOLD_PCT: ${{ github.event.inputs.threshold_pct || '50' }}
          MTN_OBSC_CLEARANCE_MARGIN_FT: ${{ github.event.inputs.clearance_margin_ft || '500' }}
          MTN_OBSC_NEIGHBORHOOD_RADIUS_NM: ${{ github.event.inputs.neighborhood_radius_nm || '50' }}
          MTN_OBSC_MIN_AREA_SQ_MI: ${{ github.event.inputs.min_area_sq_mi || '3000' }}
        run: python3 pipeline/generate_latest_mtn_obsc.py

      - name: Publish artifacts to the data-mtnobsc branch
        # Publishes this hazard's artifacts to a dedicated data branch
        # instead of committing them back to main. main used to carry
        # every one of these .npz grids, 8x/day, forever -- and .npz
        # files don't delta-compress, so each run added FULL copies
        # (~12 MB/run) to history. That is what pushed the repo to
        # 2.2 GB against a 23.5 MB working tree and made Railway's
        # "Snapshot code" step time out cloning it.
        #
        # The branch is rebuilt FROM SCRATCH every run in a throwaway
        # scratch directory with its own 'git init', then force-pushed,
        # so it is permanently exactly ONE commit deep and its size never
        # grows no matter how many times this runs. Note this is
        # deliberately NOT 'git checkout --orphan' in the workspace:
        # --orphan keeps the working tree and stages everything in it, so
        # a stray 'git add -A' would commit the ENTIRE repo (source,
        # terrain grid, the other hazard's output) onto the data branch.
        # A separate directory that has never seen the repo cannot do
        # that.
        #
        # Only Mountain Obscuration's OWN files are copied in -- the two
        # publish steps must never touch each other's artifacts, since
        # each force-push replaces its branch's whole contents and would
        # otherwise delete the other hazard's data. The globs below are
        # naturally disjoint (mtn_obsc_f* never matches ifr_f*, and vice versa).
        #
        # The manifest lands at the branch root as mtn_obsc_manifest.json
        # (https://raw.githubusercontent.com/OWNER/REPO/data-mtnobsc/mtn_obsc_manifest.json)
        # -- webapp/artifacts.py polls exactly that URL every 5 minutes
        # and re-downloads this hazard's set whenever model_cycle changes.
        #
        # The push is guarded so it can only ever move the branch's cycle
        # FORWARD -- see the monotonicity check in the script below.
        #
        # Pushing with GITHUB_TOKEN deliberately does not trigger further
        # workflow runs, and since nothing lands on main any more, data
        # updates no longer trigger a Railway redeploy either.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_BRANCH: data-mtnobsc
        run: |
          set -euo pipefail

          PUBLISH_DIR="$(mktemp -d)"
          cp "$GITHUB_WORKSPACE/output/mtn_obsc_manifest.json" "$PUBLISH_DIR/"
          cp "$GITHUB_WORKSPACE"/output/mtn_obsc_f*.geojson "$PUBLISH_DIR/"
          cp "$GITHUB_WORKSPACE"/output/mtn_obsc_f*_grid.npz "$PUBLISH_DIR/"

          MODEL_CYCLE="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['model_cycle'])" "$PUBLISH_DIR/mtn_obsc_manifest.json")"

          cd "$PUBLISH_DIR"
          echo "Publishing $(ls | wc -l) file(s) for model cycle $MODEL_CYCLE to $PUBLISH_BRANCH:"
          ls -la

          git init -q -b "$PUBLISH_BRANCH"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Cycle monotonicity guard. Because the push below is a --force
          # that replaces the branch outright, a run carrying an OLD model
          # cycle would silently overwrite a newer one and walk the live
          # site's data backwards. concurrency: (top of this file) stops
          # two runs of this hazard from overlapping, but it cannot stop
          # someone re-running an OLD run from the Actions tab -- that run
          # regenerates nothing, it republishes its original artifacts.
          #
          # Reading the branch's own manifest (rather than
          # raw.githubusercontent.com) keeps this authoritative: the raw
          # CDN can serve a stale copy for minutes, which is exactly the
          # window this guard has to be right in. --depth=1 on a branch
          # that is always one commit deep pulls its ~12 MB of
          # artifacts along with it; a couple of seconds, 8x/day, for a
          # check that can't be fooled.
          EXISTING_MANIFEST="$(mktemp)"
          if git fetch --quiet --depth=1 "$REMOTE" "$PUBLISH_BRANCH" 2>/dev/null; then
            git show "FETCH_HEAD:mtn_obsc_manifest.json" > "$EXISTING_MANIFEST" 2>/dev/null || : > "$EXISTING_MANIFEST"
          else
            echo "Branch $PUBLISH_BRANCH doesn't exist yet -- nothing to compare against."
          fi

          # set +e around it deliberately: exit 10 ("skip") is a correct
          # outcome this step has to inspect, not a failure set -e should
          # abort on.
          set +e
          python3 "$GITHUB_WORKSPACE/.github/scripts/should_publish_cycle.py" \
            --new "mtn_obsc_manifest.json" --existing "$EXISTING_MANIFEST"
          GUARD_STATUS=$?
          set -e
          if [ "$GUARD_STATUS" -eq 10 ]; then
            exit 0
          elif [ "$GUARD_STATUS" -ne 0 ]; then
            exit "$GUARD_STATUS"
          fi

          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -q -m "data: mtn_obsc $MODEL_CYCLE"

          # --force is the whole point: the remote branch's single commit
          # is replaced outright, never appended to. Retried only for
          # transient network/GitHub failures -- there is no
          # fetch-and-rebase fallback any more (and none is wanted: this
          # branch intentionally has no shared history to rebase onto).
          for attempt in 1 2 3 4 5; do
            if git push --force "$REMOTE" "$PUBLISH_BRANCH:$PUBLISH_BRANCH"; then
              echo "Pushed $PUBLISH_BRANCH successfully on attempt $attempt"
              exit 0
            fi
            echo "Push failed (attempt $attempt/5) -- retrying..."
            sleep $((attempt * 5))
          done
          echo "Failed to push $PUBLISH_BRANCH after 5 attempts"
          exit 1
