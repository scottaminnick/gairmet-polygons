name: Generate Latest IFR Polygons

on:
  # Fires 20 minutes after each real G-AIRMET cycle hour (03/09/15/21Z,
  # see GAIRMET_CYCLE_HOURS in pipeline/generate_latest_ifr.py) to give
  # NBM's posting lag some room -- NOT 20 minutes before, which would
  # always miss the cycle it's meant to be chasing and fall back to
  # the previous one.
  schedule:
    - cron: "20 3,9,15,21 * * *"
  # Manual trigger, with optional overrides so a forecaster can
  # regenerate with different settings without editing code.
  workflow_dispatch:
    inputs:
      threshold_pct:
        description: "Probability threshold (%) for hazard polygons"
        required: false
        default: "50"
      neighborhood_radius_nm:
        description: "Neighborhood-max smoothing radius (nautical miles) -- pulls nearby smaller areas into larger ones"
        required: false
        default: "50"
      min_area_sq_mi:
        description: "Minimum polygon area (sq mi) -- matches AIRMET/G-AIRMET's historical 'widespread' criterion by default"
        required: false
        default: "3000"

# Ensures only ONE run of this workflow is ever actually executing at a
# time. The ORIGINAL reason for this is gone: runs no longer push to
# main, so they can no longer reject each other with "failed to push
# some refs... Updates were rejected because the remote contains work
# that you do not have locally" -- each run force-pushes a
# from-scratch branch, which never conflicts.
#
# It is kept because force-pushing introduced a DIFFERENT race that is
# arguably worse, since it fails silently: with two overlapping runs,
# whichever finishes LAST wins outright, even if it started first and is
# carrying an OLDER model cycle. The data branch (and therefore the live
# site, which just follows model_cycle) would quietly go backwards to
# stale data, with no error anywhere. Queueing runs instead of
# overlapping them makes last-to-finish and newest-cycle the same run.
# Secondary benefit: no two runs hammer NBM for the same fields at once.
#
# cancel-in-progress stays false: a new trigger QUEUES and waits its turn
# rather than silently cancelling a run already in progress (which could
# throw away a legitimate manual trigger someone was specifically
# waiting on).
concurrency:
  group: generate-ifr-polygons
  cancel-in-progress: false

# Needed to force-push the regenerated forecast-hour snapshots to the
# data-ifr branch -- the default GITHUB_TOKEN is read-only unless
# granted this. Nothing here writes to main.
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Generate latest IFR polygons
        env:
          IFR_THRESHOLD_PCT: ${{ github.event.inputs.threshold_pct || '50' }}
          IFR_NEIGHBORHOOD_RADIUS_NM: ${{ github.event.inputs.neighborhood_radius_nm || '50' }}
          IFR_MIN_AREA_SQ_MI: ${{ github.event.inputs.min_area_sq_mi || '3000' }}
        run: python3 pipeline/generate_latest_ifr.py

      - name: Publish artifacts to the data-ifr branch
        # Publishes this hazard's artifacts to a dedicated data branch
        # instead of committing them back to main. main used to carry
        # every one of these .npz grids, 8x/day, forever -- and .npz
        # files don't delta-compress, so each run added FULL copies
        # (~8 MB/run) to history. That is what pushed the repo to
        # 2.2 GB against a 23.5 MB working tree and made Railway's
        # "Snapshot code" step time out cloning it.
        #
        # The branch is rebuilt FROM SCRATCH every run in a throwaway
        # scratch directory with its own 'git init', then force-pushed,
        # so it is permanently exactly ONE commit deep and its size never
        # grows no matter how many times this runs. Note this is
        # deliberately NOT 'git checkout --orphan' in the workspace:
        # --orphan keeps the working tree and stages everything in it, so
        # a stray 'git add -A' would commit the ENTIRE repo (source,
        # terrain grid, the other hazard's output) onto the data branch.
        # A separate directory that has never seen the repo cannot do
        # that.
        #
        # Only IFR's OWN files are copied in -- the two
        # publish steps must never touch each other's artifacts, since
        # each force-push replaces its branch's whole contents and would
        # otherwise delete the other hazard's data. The globs below are
        # naturally disjoint (ifr_f* never matches mtn_obsc_f*, and vice versa).
        #
        # The manifest lands at the branch root as ifr_manifest.json
        # (https://raw.githubusercontent.com/OWNER/REPO/data-ifr/ifr_manifest.json)
        # -- webapp/artifacts.py polls exactly that URL every 5 minutes
        # and re-downloads this hazard's set whenever model_cycle changes.
        #
        # Pushing with GITHUB_TOKEN deliberately does not trigger further
        # workflow runs, and since nothing lands on main any more, data
        # updates no longer trigger a Railway redeploy either.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_BRANCH: data-ifr
        run: |
          set -euo pipefail

          PUBLISH_DIR="$(mktemp -d)"
          cp "$GITHUB_WORKSPACE/output/ifr_manifest.json" "$PUBLISH_DIR/"
          cp "$GITHUB_WORKSPACE"/output/ifr_f*.geojson "$PUBLISH_DIR/"
          cp "$GITHUB_WORKSPACE"/output/ifr_f*_grid.npz "$PUBLISH_DIR/"

          MODEL_CYCLE="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['model_cycle'])" "$PUBLISH_DIR/ifr_manifest.json")"

          cd "$PUBLISH_DIR"
          echo "Publishing $(ls | wc -l) file(s) for model cycle $MODEL_CYCLE to $PUBLISH_BRANCH:"
          ls -la

          git init -q -b "$PUBLISH_BRANCH"
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -q -m "data: ifr $MODEL_CYCLE"

          # --force is the whole point: the remote branch's single commit
          # is replaced outright, never appended to. Retried only for
          # transient network/GitHub failures -- there is no
          # fetch-and-rebase fallback any more (and none is wanted: this
          # branch intentionally has no shared history to rebase onto).
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            if git push --force "$REMOTE" "$PUBLISH_BRANCH:$PUBLISH_BRANCH"; then
              echo "Pushed $PUBLISH_BRANCH successfully on attempt $attempt"
              exit 0
            fi
            echo "Push failed (attempt $attempt/5) -- retrying..."
            sleep $((attempt * 5))
          done
          echo "Failed to push $PUBLISH_BRANCH after 5 attempts"
          exit 1
