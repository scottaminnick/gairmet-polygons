name: Generate Latest IFR Polygons

on:
  # THE SCHEDULE IS DERIVED, NOT HAND-WRITTEN. These lines are generated
  # by pipeline.publish_schedule.cron_entries("ifr") and
  # tests/test_publish_schedule.py fails if they drift from it. The
  # offsets past +2:00 roll into later hours, which is the
  # part that is easy to get wrong editing this by hand.
  #
  # WHY +1:15 AND NOT +0:20. At 20 minutes past the synoptic hour the
  # matching NBM run is not posted, so find_latest_gairmet_cycle() fell
  # back to the PREVIOUS NBM cycle and, with the +6h lead offset, rebuilt
  # the G-AIRMET cycle that was already current. The 15Z first guess did
  # not appear until 15:20Z -- thirty-five minutes after the 1445Z
  # issuance it exists to seed.
  #
  # The four entries are RETRIES, not four separate products: +1:15,
  # +1:45, +2:15 and +2:45. Separate cron entries rather
  # than a sleep/poll loop inside one job, which would burn billable
  # minutes holding a runner and turn a late NBM into a timeout instead
  # of a clean no-op. An attempt that runs before its NBM has landed
  # falls back, rebuilds the already-published cycle, and
  # .github/scripts/should_publish_cycle.py skips it.
  #
  # +1:15 is an ESTIMATE. NBM 03Z's arrival could only be bracketed
  # between +20 minutes and +3h30m from existing logs. Every run now
  # emits an NBM-ARRIVAL line (see pipeline/gairmet_cycle.py), so after a
  # week this can be set from a measured distribution instead.
  schedule:
    - cron: "15 4,10,16,22 * * *"
    - cron: "45 4,10,16,22 * * *"
    - cron: "15 5,11,17,23 * * *"
    - cron: "45 5,11,17,23 * * *"
  # Manual trigger, with optional overrides so a forecaster can
  # regenerate with different settings without editing code.
  workflow_dispatch:
    inputs:
      threshold_pct:
        description: "Probability threshold (%) for hazard polygons"
        required: false
        default: "50"
      neighborhood_radius_nm:
        description: "Neighborhood-max smoothing radius (nautical miles) -- pulls nearby smaller areas into larger ones"
        required: false
        default: "50"
      min_area_sq_mi:
        description: "Minimum polygon area (sq mi) -- matches AIRMET/G-AIRMET's historical 'widespread' criterion by default"
        required: false
        default: "3000"

# Ensures only ONE run of this workflow is ever actually executing at a
# time. The ORIGINAL reason for this is gone: runs no longer push to
# main, so they can no longer reject each other with "failed to push
# some refs... Updates were rejected because the remote contains work
# that you do not have locally" -- each run force-pushes a
# from-scratch branch, which never conflicts.
#
# It is kept because force-pushing introduced a DIFFERENT race that is
# arguably worse, since it fails silently: with two overlapping runs,
# whichever finishes LAST wins outright, even if it started first and is
# carrying an OLDER model cycle. The data branch (and therefore the live
# site, which just follows model_cycle) would quietly go backwards to
# stale data, with no error anywhere. Queueing runs instead of
# overlapping them makes last-to-finish and newest-cycle the same run.
# Secondary benefit: no two runs hammer NBM for the same fields at once.
#
# The group is scoped to THIS workflow alone (generate_mtn_obsc.yml has
# its own, "generate-mtn-obsc-polygons"), because the race is entirely
# same-hazard: two runs of THIS workflow, force-pushing THIS branch. The
# two hazards publish to separate branches now and cannot collide with
# each other at all, so a shared group would only make Mountain
# Obscuration's long runs (tens of minutes) needlessly block IFR's.
#
# cancel-in-progress is set explicitly to false: a new trigger QUEUES and
# waits its turn rather than silently cancelling a run already in
# progress (which could throw away a legitimate manual trigger someone
# was specifically waiting on).
#
# Note this only covers runs that OVERLAP. Re-running an old run from the
# Actions tab long after the fact is a different problem, handled by the
# cycle monotonicity guard in the publish step below.
concurrency:
  group: generate-ifr-polygons
  cancel-in-progress: false

# Needed to force-push the regenerated forecast-hour snapshots to the
# data-ifr branch -- the default GITHUB_TOKEN is read-only unless
# granted this. Nothing here writes to main.
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Generate latest IFR polygons
        env:
          IFR_THRESHOLD_PCT: ${{ github.event.inputs.threshold_pct || '50' }}
          IFR_NEIGHBORHOOD_RADIUS_NM: ${{ github.event.inputs.neighborhood_radius_nm || '50' }}
          IFR_MIN_AREA_SQ_MI: ${{ github.event.inputs.min_area_sq_mi || '3000' }}
        run: python3 pipeline/generate_latest_ifr.py

      - name: Publish artifacts to the data-ifr branch
        # Publishes this hazard's artifacts to a dedicated data branch
        # instead of committing them back to main. main used to carry
        # every one of these .npz grids, 8x/day, forever -- and .npz
        # files don't delta-compress, so each run added FULL copies
        # (~8 MB/run) to history. That is what pushed the repo to
        # 2.2 GB against a 23.5 MB working tree and made Railway's
        # "Snapshot code" step time out cloning it.
        #
        # The branch is rebuilt FROM SCRATCH every run in a throwaway
        # scratch directory with its own 'git init', then force-pushed,
        # so it is permanently exactly ONE commit deep and its size never
        # grows no matter how many times this runs. Note this is
        # deliberately NOT 'git checkout --orphan' in the workspace:
        # --orphan keeps the working tree and stages everything in it, so
        # a stray 'git add -A' would commit the ENTIRE repo (source,
        # terrain grid, the other hazard's output) onto the data branch.
        # A separate directory that has never seen the repo cannot do
        # that.
        #
        # Only IFR's OWN files are copied in -- the two
        # publish steps must never touch each other's artifacts, since
        # each force-push replaces its branch's whole contents and would
        # otherwise delete the other hazard's data. The globs below are
        # naturally disjoint (ifr_f* never matches mtn_obsc_f*, and vice versa).
        #
        # The manifest lands at the branch root as ifr_manifest.json
        # (https://raw.githubusercontent.com/OWNER/REPO/data-ifr/ifr_manifest.json)
        # -- webapp/artifacts.py polls exactly that URL every 5 minutes
        # and re-downloads this hazard's set whenever model_cycle changes.
        #
        # The push is guarded so it can only ever move the branch's cycle
        # FORWARD -- see the monotonicity check in the script below.
        #
        # Pushing with GITHUB_TOKEN deliberately does not trigger further
        # workflow runs, and since nothing lands on main any more, data
        # updates no longer trigger a Railway redeploy either.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_BRANCH: data-ifr
        run: |
          set -euo pipefail

          PUBLISH_DIR="$(mktemp -d)"
          cp "$GITHUB_WORKSPACE/output/ifr_manifest.json" "$PUBLISH_DIR/"
          cp "$GITHUB_WORKSPACE"/output/ifr_f*.geojson "$PUBLISH_DIR/"
          cp "$GITHUB_WORKSPACE"/output/ifr_f*_grid.npz "$PUBLISH_DIR/"

          MODEL_CYCLE="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['model_cycle'])" "$PUBLISH_DIR/ifr_manifest.json")"

          cd "$PUBLISH_DIR"
          echo "Publishing $(ls | wc -l) file(s) for model cycle $MODEL_CYCLE to $PUBLISH_BRANCH:"
          ls -la

          git init -q -b "$PUBLISH_BRANCH"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Cycle monotonicity guard. Because the push below is a --force
          # that replaces the branch outright, a run carrying an OLD model
          # cycle would silently overwrite a newer one and walk the live
          # site's data backwards. concurrency: (top of this file) stops
          # two runs of this hazard from overlapping, but it cannot stop
          # someone re-running an OLD run from the Actions tab -- that run
          # regenerates nothing, it republishes its original artifacts.
          #
          # Reading the branch's own manifest (rather than
          # raw.githubusercontent.com) keeps this authoritative: the raw
          # CDN can serve a stale copy for minutes, which is exactly the
          # window this guard has to be right in. --depth=1 on a branch
          # that is always one commit deep pulls its ~8 MB of
          # artifacts along with it; a couple of seconds, 8x/day, for a
          # check that can't be fooled.
          EXISTING_MANIFEST="$(mktemp)"
          if git fetch --quiet --depth=1 "$REMOTE" "$PUBLISH_BRANCH" 2>/dev/null; then
            git show "FETCH_HEAD:ifr_manifest.json" > "$EXISTING_MANIFEST" 2>/dev/null || : > "$EXISTING_MANIFEST"
          else
            echo "Branch $PUBLISH_BRANCH doesn't exist yet -- nothing to compare against."
          fi

          # set +e around it deliberately: exit 10 ("skip") is a correct
          # outcome this step has to inspect, not a failure set -e should
          # abort on.
          set +e
          python3 "$GITHUB_WORKSPACE/.github/scripts/should_publish_cycle.py" \
            --new "ifr_manifest.json" --existing "$EXISTING_MANIFEST" --hazard ifr
          GUARD_STATUS=$?
          set -e
          if [ "$GUARD_STATUS" -eq 10 ]; then
            exit 0
          elif [ "$GUARD_STATUS" -ne 0 ]; then
            exit "$GUARD_STATUS"
          fi

          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -q -m "data: ifr $MODEL_CYCLE"

          # --force is the whole point: the remote branch's single commit
          # is replaced outright, never appended to. Retried only for
          # transient network/GitHub failures -- there is no
          # fetch-and-rebase fallback any more (and none is wanted: this
          # branch intentionally has no shared history to rebase onto).
          for attempt in 1 2 3 4 5; do
            if git push --force "$REMOTE" "$PUBLISH_BRANCH:$PUBLISH_BRANCH"; then
              echo "Pushed $PUBLISH_BRANCH successfully on attempt $attempt"
              exit 0
            fi
            echo "Push failed (attempt $attempt/5) -- retrying..."
            sleep $((attempt * 5))
          done
          echo "Failed to push $PUBLISH_BRANCH after 5 attempts"
          exit 1
