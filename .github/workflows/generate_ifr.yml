name: Generate Latest IFR Polygons

on:
  # Fires 20 minutes after each real G-AIRMET cycle hour (03/09/15/21Z,
  # see GAIRMET_CYCLE_HOURS in pipeline/generate_latest_ifr.py) to give
  # NBM's posting lag some room -- NOT 20 minutes before, which would
  # always miss the cycle it's meant to be chasing and fall back to
  # the previous one.
  schedule:
    - cron: "20 3,9,15,21 * * *"
  # Manual trigger, with optional overrides so a forecaster can
  # regenerate with different settings without editing code.
  workflow_dispatch:
    inputs:
      threshold_pct:
        description: "Probability threshold (%) for hazard polygons"
        required: false
        default: "50"
      neighborhood_radius_nm:
        description: "Neighborhood-max smoothing radius (nautical miles) -- pulls nearby smaller areas into larger ones"
        required: false
        default: "50"
      min_area_sq_mi:
        description: "Minimum polygon area (sq mi) -- matches AIRMET/G-AIRMET's historical 'widespread' criterion by default"
        required: false
        default: "3000"

# Ensures only ONE run of this workflow is ever actually executing
# (including its git push) at a time. Without this, a manual trigger
# landing close to a scheduled run -- or two manual triggers close
# together -- both check out main, both generate fresh output/ files,
# and whichever one pushes SECOND gets rejected with "failed to push
# some refs... Updates were rejected because the remote contains work
# that you do not have locally." cancel-in-progress is deliberately
# false: a new trigger QUEUES and waits its turn rather than silently
# cancelling a run already in progress (which could throw away a
# legitimate manual trigger someone was specifically waiting on).
concurrency:
  group: generate-ifr-polygons
  cancel-in-progress: false

# Needed to commit the regenerated forecast-hour snapshots back to
# the repo -- the default GITHUB_TOKEN is read-only unless granted this.
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Generate latest IFR polygons
        env:
          IFR_THRESHOLD_PCT: ${{ github.event.inputs.threshold_pct || '50' }}
          IFR_NEIGHBORHOOD_RADIUS_NM: ${{ github.event.inputs.neighborhood_radius_nm || '50' }}
          IFR_MIN_AREA_SQ_MI: ${{ github.event.inputs.min_area_sq_mi || '3000' }}
        run: python3 pipeline/generate_latest_ifr.py

      - name: Commit and push updated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Auto-update IFR polygons [skip ci]"

          # concurrency: above should prevent same-workflow races
          # entirely, but retry with rebase as a defensive fallback for
          # a DIFFERENT scenario: some unrelated commit (e.g. a merged
          # PR touching a different file) landing on main in the narrow
          # window before this push. NOTE: this will NOT help if the
          # race is actually two runs of THIS SAME workflow (which
          # concurrency: is what prevents) -- both would have generated
          # different content for the exact same output/ files, so a
          # rebase would hit real conflicts, not resolve cleanly.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) -- fetching and rebasing..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase hit a real conflict (likely two runs racing on the same output files -- concurrency: should prevent this going forward). Aborting."
              git rebase --abort
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "Failed to push after 5 attempts"
          exit 1
