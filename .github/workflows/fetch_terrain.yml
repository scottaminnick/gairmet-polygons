name: Fetch Terrain Grid (Mountain Obscuration)

# Manual trigger only -- deliberately NOT on a schedule. Unlike
# generate_ifr.yml, terrain doesn't change forecast to forecast, so
# this only needs to run once (or rarely -- e.g. if coverage is ever
# widened, or terrain_radius_nm is changed, see the input below).
#
# IMPORTANT DISTINCTION from generate_ifr.yml's threshold_pct /
# neighborhood_radius_nm / min_area_sq_mi inputs: those are applied at
# HAZARD-GENERATION time, on the fly, against an already-fixed grid --
# a forecaster can change them and immediately see different polygons
# from the same underlying data. terrain_radius_nm below is different:
# it gets BAKED INTO ridge_elevation_ft at fetch time. Changing it
# means re-running this whole workflow, not flipping a runtime slider.
on:
  workflow_dispatch:
    inputs:
      terrain_radius_nm:
        description: "Radius (nm) to search for the highest nearby ridge/peak -- baked into the cached grid at fetch time, not a runtime slider"
        required: false
        default: "12.0"

# Needed to commit the fetched/processed terrain grid back to the repo
# -- the default GITHUB_TOKEN is read-only unless granted this (same
# reason generate_ifr.yml needs it).
permissions:
  contents: write

jobs:
  fetch_terrain:
    runs-on: ubuntu-latest
    # This fetches on the order of 1,700 individual tiles from a
    # public S3 bucket with no official SLA (see pipeline/fetch_terrain.py's
    # module docstring) -- generous timeout so a slow run doesn't get
    # killed partway, without letting a genuinely stuck job run forever.
    timeout-minutes: 90
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Deliberately much lighter than requirements-pipeline.txt -- this
      # script talks to a plain S3 bucket over HTTPS, not GRIB2/NBM, so
      # it doesn't need cfgrib/xarray/herbie-data/etc. Same "only install
      # what this specific script actually touches" reasoning already
      # used for inspect_nbm.yml.
      - name: Install dependencies
        # Declared in a file rather than inline, so a change to what
        # pipeline/fetch_terrain.py imports can be checked against it --
        # see requirements-terrain.txt for the failure that motivated it.
        run: pip install -r requirements-terrain.txt

      # THE MOSAIC IS CHECKPOINTED SEPARATELY FROM THE STEPS THAT USE IT.
      #
      # Assembling it means downloading 1,708 tiles, which is nearly all
      # of this job's wall time; everything after it is a few minutes of
      # array work. A run that got through the download and then died on
      # the very last step (which is exactly what a missing dependency in
      # compute_output_grids did) had to redo the whole fetch.
      #
      # restore/save are used rather than actions/cache because the plain
      # action only saves at the END of a SUCCESSFUL job -- precisely the
      # case that does not apply here. Saving immediately after assembly,
      # with if: always(), is what makes the checkpoint survive a later
      # failure.
      #
      # The key is deliberately coarse. Correctness does not rest on it:
      # the checkpoint stores the bounds and downsample factor it was
      # built from, and fetch_terrain.py refetches if they don't match
      # what it wants. A key can be forgotten; that check cannot.
      - name: Restore mosaic checkpoint
        id: mosaic-cache
        uses: actions/cache/restore@v4
        with:
          path: data/terrain/mosaic_cache.npz
          key: terrain-mosaic-v1

      - name: Assemble mosaic (downloads tiles only if the checkpoint missed)
        run: python3 pipeline/fetch_terrain.py --stage mosaic

      - name: Save mosaic checkpoint
        if: always() && steps.mosaic-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/terrain/mosaic_cache.npz
          key: terrain-mosaic-v1

      - name: Compute terrain grids
        env:
          MTN_OBSC_TERRAIN_RADIUS_NM: ${{ github.event.inputs.terrain_radius_nm || '12.0' }}
        run: python3 pipeline/fetch_terrain.py --stage grids

      # Backup/inspection copy independent of the git commit below --
      # useful if the commit step ever fails (e.g. branch protection)
      # or if you just want to eyeball the output without pulling the
      # branch locally.
      - name: Upload terrain grid artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-grid
          path: data/terrain/terrain_grid.npz
          if-no-files-found: warn

      - name: Commit and push terrain grid
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Named explicitly, NOT 'git add data/terrain/'. The directory
          # also holds mosaic_cache.npz, a ~30 MB pre-compressed
          # checkpoint that already persists via actions/cache above --
          # the glob committed it once (3975d0f) and would have done so on
          # every run. .npz files do not delta-compress, so that is a full
          # fresh copy in history each time; the same mechanism took this
          # repo to 2.2 GB before output/ was untracked. It is gitignored
          # now as well, but the glob is the thing that reaches for
          # whatever happens to be there next.
          git add data/terrain/terrain_grid.npz
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update cached terrain grid (terrain_radius_nm=${{ github.event.inputs.terrain_radius_nm || '12.0' }}) [skip ci]"
          git push
